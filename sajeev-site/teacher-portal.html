<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老師中心 | Sajeev Partner</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="sajeev-style.css">
    <style>
        .portal-container {
            padding: 120px 2rem 4rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .portal-header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 3rem;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 2rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-label { color: #94a3b8; font-size: 0.9rem; margin-bottom: 0.5rem; }
        .stat-value { font-size: 2rem; font-weight: 700; color: var(--sajeev-secondary); }
        
        .orders-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            overflow: hidden;
        }
        .orders-table th, .orders-table td {
            padding: 1.25rem 1.5rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .orders-table th { background: rgba(255, 255, 255, 0.05); color: #94a3b8; font-weight: 500; }
        .status-tag {
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.8rem;
        }
        .status-completed { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="sajeev-site">
    <nav class="glass-nav">
        <div class="nav-container">
            <a href="index.html" class="logo">Sajeev<span>.Portal</span></a>
            <div class="nav-links">
                <span id="teacher-name">載入中...</span>
                <button onclick="logout()" class="btn-outline" style="margin-left: 1rem; padding: 0.5rem 1rem;">登出</button>
            </div>
        </div>
    </nav>

    <div class="portal-container">
        <div class="portal-header">
            <div>
                <h1>老師業績中心</h1>
                <p>查看您的推廣成效與預計收益</p>
            </div>
            <div id="referral-code-box" style="background: var(--sajeev-primary); padding: 1rem; border-radius: 12px;">
                <span style="font-size: 0.8rem; display: block; opacity: 0.8;">您的專屬推薦碼</span>
                <strong id="ref-code" style="font-size: 1.2rem;">---</strong>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">累積成交訂單</div>
                <div class="stat-value" id="stat-count">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">累積銷售總額</div>
                <div class="stat-value" id="stat-sales">NT$ 0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">預計分潤收益 (15%)</div>
                <div class="stat-value" id="stat-commission">NT$ 0</div>
            </div>
        </div>

        <div class="admin-card">
            <div class="card-header" style="padding: 1.5rem 2rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
                <h3>推廣訂單明細</h3>
            </div>
            <table class="orders-table">
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>品項</th>
                        <th>金額</th>
                        <th>來源</th>
                        <th>狀態</th>
                    </tr>
                </thead>
                <tbody id="teacher-orders-list">
                    <tr><td colspan="5" style="text-align: center; padding: 3rem; color: #64748b;">暫無數據</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="/supabase-config.js"></script>
    <script>
        // Simple mock logic for demonstration since teacher auth table is not yet defined
        document.addEventListener('DOMContentLoaded', () => {
            const mockTeacher = { name: 'Sajeev 老師', code: 'SAJEEV2026' };
            document.getElementById('teacher-name').textContent = mockTeacher.name;
            document.getElementById('ref-code').textContent = mockTeacher.code;
            
            loadTeacherData(mockTeacher.code);
        });

        async function loadTeacherData(code) {
            if (!code) {
                code = prompt('請輸入您的老師推廣碼 (例如: SAJEEV):');
                if (!code) return;
            }
            
            try {
                // Fetch the affiliate info to confirm the name and commission rate
                const { data: aff, error: affError } = await supabaseClient
                    .from('affiliates')
                    .select('*')
                    .eq('code', code.toUpperCase())
                    .single();

                if (affError) throw new Error('找不到該推廣碼');

                document.getElementById('teacher-name').textContent = `${aff.name} 老師`;
                document.getElementById('ref-code').textContent = aff.code;

                const { data: orders, error } = await supabaseClient
                    .from('orders')
                    .select('*')
                    .eq('referral_id', aff.code);

                if (error) throw error;
                
                renderOrders(orders, aff.commission_rate || 0.15);
            } catch (err) {
                console.error('Portal Error:', err);
                alert('載入失敗：' + err.message);
            }
        }

        function renderOrders(orders, commissionRate) {
            const list = document.getElementById('teacher-orders-list');
            const total = orders.reduce((sum, o) => sum + (Number(o.total_amount) || 0), 0);
            
            document.getElementById('stat-count').textContent = orders.length;
            document.getElementById('stat-sales').textContent = `NT$ ${total.toLocaleString()}`;
            document.getElementById('stat-commission').textContent = `NT$ ${Math.floor(total * commissionRate).toLocaleString()}`;

            list.innerHTML = orders.map(o => `
                <tr>
                    <td>${new Date(o.created_at).toLocaleDateString()}</td>
                    <td>${o.items ? o.items.map(i => i.name).join(', ') : '課程'}</td>
                    <td>NT$ ${Number(o.total_amount).toLocaleString()}</td>
                    <td>${o.source_domain || 'source31.com'}</td>
                    <td><span class="status-tag status-completed">已完成</span></td>
                </tr>
            `).join('');
        }

        function logout() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
