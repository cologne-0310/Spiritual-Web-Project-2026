<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase 診斷工具 - Spiritual Web</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; padding: 40px; }
        .debug-container { max-width: 800px; margin: 0 auto; background: rgba(30, 41, 59, 0.7); padding: 30px; border-radius: 12px; backdrop-filter: blur(10px); }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 20px; }
        .status-online { background: #059669; color: white; }
        .status-offline { background: #dc2626; color: white; }
        .table-check { margin-top: 20px; padding: 15px; background: #334155; border-radius: 8px; }
        .check-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #475569; padding-bottom: 10px; }
        .check-item:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <div class="debug-container">
        <h1>Supabase 連線診斷</h1>
        <div id="connection-status" class="status-badge status-offline">檢測中...</div>
        
        <div class="table-check">
            <h3>資料表狀態</h3>
            <div id="table-results">
                <!-- 動態注入 -->
            </div>
        </div>
        
        <button onclick="runDiagnostics()" style="margin-top: 20px; padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer;">重新執行檢測</button>
    </div>

    <script>
        async function runDiagnostics() {
            const statusEl = document.getElementById('connection-status');
            const resultsEl = document.getElementById('table-results');
            resultsEl.innerHTML = '正在檢測資料表...';

            if (!window.supabaseClient) {
                statusEl.className = 'status-badge status-offline';
                statusEl.innerText = 'Supabase Client 未初始化';
                return;
            }

            try {
                // 測試基本連線
                const tables = ['orders', 'affiliates', 'news', 'products'];
                let html = '';

                for (const table of tables) {
                    const { error } = await window.supabaseClient.from(table).select('*').limit(1);
                    const exists = !error || (error.code !== '42P01'); // 42P01 is "relation does not exist"
                    html += `
                        <div class="check-item">
                            <span>${table}</span>
                            <span style="color: ${exists ? '#10b981' : '#f43f5e'}">${exists ? '✅ 已建立' : '❌ 未找到 (需要 SQL 遷移)'}</span>
                        </div>
                    `;
                }
                
                statusEl.className = 'status-badge status-online';
                statusEl.innerText = '已連線至 Supabase';
                resultsEl.innerHTML = html;

            } catch (e) {
                statusEl.className = 'status-badge status-offline';
                statusEl.innerText = '連線出錯: ' + e.message;
            }
        }

        window.onload = runDiagnostics;
    </script>
</body>
</html>
